<!DOCTYPE html>
<html>
<head>
<title>Boda Boda Jumper</title>
<style>
body { text-align: center; background: #111; color: white; font-family: Arial; }
canvas { background: skyblue; border: 4px solid orange; }
button { padding: 10px 20px; font-size: 18px; background: orange; border: none; cursor: pointer; }
</style>
</head>
<body>
<h1>🏍️ BODA BODA JUMPER 🏍️</h1>
<p>Score: <span id="score">0</span> | Fare: Ksh <span id="fare">0</span> | Lives: <span id="lives">3</span></p>
<p>Press SPACE or ↑ or TAP to JUMP!</p>
<canvas id="game" width="600" height="300"></canvas>
<p id="msg"></p>
<button onclick="location.reload()">Play Again</button>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let player = { x: 80, y: 210, w: 50, h: 50, vy: 0, jumping: false };
let gravity = 0.8;
let ground = 210;
let obstacles = [];
let coins = [];
let score = 0, fare = 0, lives = 3, gameOver = false, speed = 5;
function jump() { if (!player.jumping && !gameOver) { player.vy = -14; player.jumping = true; } }
document.addEventListener('keydown', e => { if (e.code === 'Space' || e.code === 'ArrowUp') jump(); });
canvas.addEventListener('click', jump);
function spawnObstacle() {
  let type = Math.random() > 0.5 ? 'pothole' : 'car';
  obstacles.push({ x: 600, y: type === 'pothole' ? 240 : 205, w: type === 'pothole' ? 40 : 60, h: type === 'pothole' ? 20 : 55, type: type });
}
function spawnCoin() { coins.push({ x: 600, y: Math.random() * 100 + 80, r: 14 }); }
setInterval(spawnObstacle, 1100);
setInterval(spawnCoin, 1600);
function update() {
  if (gameOver) return;
  player.vy += gravity; player.y += player.vy;
  if (player.y >= ground) { player.y = ground; player.vy = 0; player.jumping = false; }
  for (let i = obstacles.length - 1; i >= 0; i--) {
    obstacles[i].x -= speed;
    if (obstacles[i].x < -70) { obstacles.splice(i, 1); score += 10; }
    else if (player.x < obstacles[i].x + obstacles[i].w && player.x + player.w > obstacles[i].x && player.y < obstacles[i].y + obstacles[i].h && player.y + player.h > obstacles[i].y) {
      obstacles.splice(i, 1); lives--;
      if (lives <= 0) { gameOver = true; document.getElementById('msg').innerText = "💥 AJALI! GAME OVER!"; }
    }
  }
  for (let i = coins.length - 1; i >= 0; i--) {
    coins[i].x -= speed;
    if (coins[i].x < -20) coins.splice(i, 1);
    else if (Math.abs(coins[i].x - (player.x + 25)) < 35 && Math.abs(coins[i].y - (player.y + 25)) < 35) { coins.splice(i, 1); fare += 50; score += 20; }
  }
  score++;
  document.getElementById('score').innerText = score;
  document.getElementById('fare').innerText = fare;
  document.getElementById('lives').innerText = lives;
}
function draw() {
  ctx.clearRect(0, 0, 600, 300);
  ctx.fillStyle = "#8B4513"; ctx.fillRect(0, 260, 600, 40);
  ctx.fillStyle = "white"; for (let x = 0; x < 600; x += 50) ctx.fillRect(x, 275, 25, 5);
  ctx.fillStyle = "gold";
  for (let c of coins) { ctx.beginPath(); ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = "black"; ctx.fillText("50", c.x - 8, c.y + 4); ctx.fillStyle = "gold"; }
  for (let o of obstacles) {
    if (o.type === 'pothole') { ctx.fillStyle = "black"; ctx.beginPath(); ctx.ellipse(o.x + 20, o.y + 10, 20, 10, 0, 0, Math.PI * 2); ctx.fill(); }
    else { ctx.fillStyle = "red"; ctx.fillRect(o.x, o.y, o.w, o.h); ctx.fillStyle = "lightblue"; ctx.fillRect(o.x + 8, o.y + 8, o.w - 16, 18); }
  }
  ctx.fillStyle = "orange"; ctx.fillRect(player.x, player.y, player.w, player.h);
  ctx.fillStyle = "black"; ctx.font = "bold 12px Arial"; ctx.fillText("BODA", player.x + 5, player.y + 28);
  ctx.beginPath(); ctx.arc(player.x + 10, player.y + 50, 10, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(player.x + 40, player.y + 50, 10, 0, Math.PI * 2); ctx.fill();
}
function loop() { update(); draw(); if (!gameOver) requestAnimationFrame(loop); }
loop();
</script>
</body>
</html>
