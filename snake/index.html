<!DOCTYPE html>
<html>
<head>
<title>Snake Game</title>
<style>
body { text-align: center; background: #111; color: white; font-family: Arial; }
canvas { background: #222; border: 4px solid lime; }
button { padding: 10px 20px; font-size: 18px; background: lime; border: none; cursor: pointer; }
</style>
</head>
<body>
<h1>🐍 SNAKE GAME 🐍</h1>
<p>Score: <span id="score">0</span> | Best: <span id="best">0</span></p>
<p>Use ARROW KEYS or WASD to move. Eat the red food!</p>
<canvas id="game" width="400" height="400"></canvas>
<p id="msg"></p>
<button onclick="location.reload()">Play Again</button>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let box = 20;
let snake = [{x: 9*box, y: 10*box}];
let food = {x: Math.floor(Math.random()*19)*box, y: Math.floor(Math.random()*19)*box};
let dx = box, dy = 0;
let score = 0;
let best = localStorage.getItem('snakeBest') || 0;
document.getElementById('best').innerText = best;
let gameOver = false;
document.addEventListener('keydown', e => {
  if ((e.key === 'ArrowLeft' || e.key === 'a') && dx === 0) { dx = -box; dy = 0; }
  if ((e.key === 'ArrowUp' || e.key === 'w') && dy === 0) { dx = 0; dy = -box; }
  if ((e.key === 'ArrowRight' || e.key === 'd') && dx === 0) { dx = box; dy = 0; }
  if ((e.key === 'ArrowDown' || e.key === 's') && dy === 0) { dx = 0; dy = box; }
});
function draw() {
  if (gameOver) return;
  ctx.fillStyle = "#222"; ctx.fillRect(0, 0, 400, 400);
  // food
  ctx.fillStyle = "red"; ctx.fillRect(food.x, food.y, box, box);
  // snake
  for (let i = 0; i < snake.length; i++) {
    ctx.fillStyle = i === 0 ? "lime" : "green";
    ctx.fillRect(snake[i].x, snake[i].y, box-2, box-2);
  }
  let head = {x: snake[0].x + dx, y: snake[0].y + dy};
  // wall collision
  if (head.x < 0 || head.x >= 400 || head.y < 0 || head.y >= 400) { endGame(); return; }
  // self collision
  for (let s of snake) { if (head.x === s.x && head.y === s.y) { endGame(); return; } }
  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score += 10;
    document.getElementById('score').innerText = score;
    food = {x: Math.floor(Math.random()*19)*box, y: Math.floor(Math.random()*19)*box};
  } else {
    snake.pop();
  }
}
function endGame() {
  gameOver = true;
  if (score > best) { best = score; localStorage.setItem('snakeBest', best); document.getElementById('best').innerText = best; }
  document.getElementById('msg').innerText = "💀 GAME OVER! Score: " + score;
}
setInterval(draw, 130);
</script>
</body>
</html>
