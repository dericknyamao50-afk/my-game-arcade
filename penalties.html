<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penalty shoot</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Penalty Shoot</h1>
    <p>Move your mouse/finger to aim.Click to shoot</p>
    <div id="game-container">
        <canvas id="game-canvas" width="600" height="400"></canvas>
    </div>
        <div id="score-board">
      Score: <span id="score">0</span> / 5 &nbsp; | &nbsp; Shots: <span id="shots">0</span>/5
    </div>

    <div id="message">Aim for the corners!</div>
    <br>
    <button id="restart-button">Restart</button>

    <script src="script.js"></script>


</body>
</html>
